apiVersion: catalog.cluster.local/v2
kind: HelmChart
metadata:
  name: my-helmchart-nginx-instance
  namespace: catalog-examples
spec:
  parameters:
    chart:
      repository: oci://registry-1.docker.io/bitnamicharts
      name: nginx
      version: "18.2.5"
    values:
      replicaCount: 1
      service:
        type: ClusterIP
