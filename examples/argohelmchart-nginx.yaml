apiVersion: catalog.cluster.local/v2
kind: ArgoHelmChart
metadata:
  name: my-argohelmchart-nginx-instance
  namespace: catalog-examples
spec:
  parameters:
    chart:
      repository: oci://registry-1.docker.io/bitnamicharts
      name: nginx
      version: "18.2.5"
    secrets:
      - name: my-argohelmchart-nginx-instance-env
        type: Opaque
        data: |
          UPSTREAM_TOKEN: replace-me
    values: |
      replicaCount: 1
      service:
        type: ClusterIP
      extraEnvVarsSecret: my-argohelmchart-nginx-instance-env
