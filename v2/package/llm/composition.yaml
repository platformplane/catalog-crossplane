apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: llmsv2.catalog.cluster.local
spec:
  compositeTypeRef:
    apiVersion: catalog.cluster.local/v1
    kind: LLMCompositeV2

  writeConnectionSecretsToNamespace: crossplane-system

  mode: Pipeline
  pipeline:
    - step: get-environment-configs
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: environment

    - step: llm
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $kind := .observed.composite.resource.kind }}
            {{ $xrName := .observed.composite.resource.metadata.name }}
            {{ $namespace := .observed.composite.resource.metadata.namespace }}

            {{ $params := .observed.composite.resource.spec.parameters }}

            {{ $host := regexReplaceAll "[^a-z0-9-]" ($xrName | lower) "" }}
            {{ $zone := index $.context "apiextensions.crossplane.io/environment" "zone" }}

            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $xrName }}-configmap
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "configmap"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $xrName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      app.kubernetes.io/name: llm
                      app.kubernetes.io/instance: {{ $xrName }}
                  data:
                    config.yaml: |
                      authorizers:
                        - type: static
                          token: ${TOKEN}

                      providers:
                        - type: ollama
                          url: http://localhost:11434
                          models:
                            gemma-2-2b:
                              id: gemma2:2b

                            gemma-2-9b:
                              id: gemma2:9b

                            llama-3.1-8b:
                              id: llama3.1:8b

                            mistral-7b:
                              id: mistral:7b

                            mistral-nemo-12b:
                              id: mistral-nemo:12b

                            phi-3-mini:
                              id: phi3:mini

                            phi-3-medium:
                              id: phi3:medium

                            nomic-embed-text-v1:
                              id: nomic-embed-text:v1.5
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $xrName }}-secret
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "secret"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $xrName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      app.kubernetes.io/name: llm
                      app.kubernetes.io/instance: {{ $xrName }}
                  stringData:
                    token: {{ dig "resources" "secret" "resource" "spec" "forProvider" "manifest" "stringData" "token" (printf "sk-%s" (randAlphaNum 48)) .observed }}
                    password: {{ dig "resources" "secret" "resource" "spec" "forProvider" "manifest" "stringData" "password" (randAlphaNum 12) .observed }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $xrName }}-deployment
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "deployment"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: {{ $xrName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      app.kubernetes.io/name: llm
                      app.kubernetes.io/instance: {{ $xrName }}
                  spec:
                    strategy:
                      type: Recreate
                    selector:
                      matchLabels:
                        catalog.cluster.local/kind: {{ $kind }}
                        catalog.cluster.local/name: {{ $xrName }}
                        app.kubernetes.io/name: llm
                        app.kubernetes.io/instance: {{ $xrName }}
                    template:
                      metadata:
                        labels:
                          catalog.cluster.local/kind: {{ $kind }}
                          catalog.cluster.local/name: {{ $xrName }}
                          app.kubernetes.io/name: llm
                          app.kubernetes.io/instance: {{ $xrName }}
                      spec:
                        containers:
                          - name: platform
                            image: ghcr.io/adrianliechti/llama-platform
                            env:
                              - name: BASE_URL
                                value: https://{{ $host }}.{{ $zone }}
                              - name: TOKEN
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $xrName }}
                                    key: token
                            volumeMounts:
                              - name: config
                                mountPath: /config.yaml
                                subPath: config.yaml
                              - name: data
                                mountPath: /data
                            resources: {}
                          - name: ollama
                            image: ghcr.io/adrianliechti/ollama
                            imagePullPolicy: Always
                            env:
                              - name: MODEL
                                value: gemma2:2b,gemma2:9b,llama3.1:8b,mistral:7b,mistral-nemo:12b,phi3:mini,phi3:medium,nomic-embed-text:v1.5
                            volumeMounts:
                              - name: data
                                subPath: ollama
                                mountPath: /root/.ollama
                            resources: {}
                          - name: chat
                            image: ghcr.io/adrianliechti/llama-streamlit
                            imagePullPolicy: Always
                            env:
                              - name: OPENAI_BASE_URL
                                value: http://localhost:8080/v1
                              - name: OPENAI_API_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $xrName }}
                                    key: token
                              - name: PASSWORD
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $xrName }}
                                    key: password
                            resources: {}
                        volumes:
                          - name: config
                            configMap:
                              name: {{ $xrName }}
                          - name: data
                            persistentVolumeClaim:
                              claimName: {{ $xrName }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $xrName }}-service
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "service"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $xrName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      app.kubernetes.io/name: llm
                      app.kubernetes.io/instance: {{ $xrName }}
                  spec:
                    type: ClusterIP
                    selector:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      app.kubernetes.io/name: llm
                      app.kubernetes.io/instance: {{ $xrName }}
                    ports:
                      - name: api
                        port: 80
                        targetPort: 8080
                      - name: http
                        port: 8501
                        targetPort: 8501
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $xrName }}-pvc
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "persistentvolumeclaim"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  kind: PersistentVolumeClaim
                  apiVersion: v1
                  metadata:
                    name: {{ $xrName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      app.kubernetes.io/name: llm
                      app.kubernetes.io/instance: {{ $xrName }}
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 100Gi
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $xrName }}-ingress
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "ingress"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: {{ $xrName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      app.kubernetes.io/name: llm
                      app.kubernetes.io/instance: {{ $xrName }}
                    annotations:
                      kubernetes.io/tls-acme: "true"
                  spec:
                    {{- if or ($params.ingress.public) (eq $params.ingress nil) }}
                    ingressClassName: nginx
                    {{- else }}
                    ingressClassName: nginx-internal
                    {{- end }}
                    rules:
                      - host: {{ $host }}.{{ $zone }}
                        http:
                          paths:
                            - path: /v1/
                              pathType: Prefix
                              backend:
                                service:
                                  name: {{ $xrName }}
                                  port:
                                    number: 80
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: {{ $xrName }}
                                  port:
                                    number: 8501
                    tls:
                      - hosts:
                          - {{ $host }}.{{ $zone }}
                        secretName: {{ $xrName }}-tls
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $xrName }}-connection
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            {{ if eq $.observed.resources nil }}
            data: {}
            {{ else }}
            data:
              host: {{ printf "%s.%s" $host $zone | b64enc }}
              token: {{ dig "resources" "secret" "resource" "spec" "forProvider" "manifest" "stringData" "token" "no value yet" .observed | b64enc }}
              password: {{ dig "resources" "secret" "resource" "spec" "forProvider" "manifest" "stringData" "password" "no value yet" .observed | b64enc }}
            {{ end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
