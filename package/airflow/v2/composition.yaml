# Composition Definition: https://doc.crds.dev/github.com/crossplane/crossplane/apiextensions.crossplane.io/Composition/v1@v1.15.0
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: airflows-v2.catalog.cluster.local
spec:
  compositeTypeRef:
    apiVersion: catalog.cluster.local/v2
    kind: Airflow
  writeConnectionSecretsToNamespace: crossplane-system

  mode: Pipeline
  pipeline:
    - step: get-environment-configs
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: environment

    - step: airflow
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $xr := .observed.composite.resource }}
            {{ $kind := $xr.kind }}
            {{ $xrName := $xr.metadata.name }}
            {{ $namespace := $xr.metadata.namespace }}

            {{ $params := .observed.composite.resource.spec.parameters }}

            {{ $host := regexReplaceAll "[^a-z0-9-]" ($xrName | lower) "" }}
            {{ $zone := index $.context "apiextensions.crossplane.io/environment" "zone" }}

            apiVersion: helm.m.crossplane.io/v1beta1
            kind: Release # full example, see: https://github.com/crossplane-contrib/provider-helm/blob/master/examples/sample/release.yaml
            metadata:
              name: {{ $xrName }}
              namespace: {{ $namespace }}
              annotations:
                crossplane.io/external-name: {{ $xrName }}
                gotemplating.fn.crossplane.io/composition-resource-name: "helm-release"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-helm
              forProvider:
                chart:
                  name: airflow
                  repository: https://airflow.apache.org
                  version: 1.18.0
                namespace: {{ $namespace }}
                values:
                  labels:
                    catalog.cluster.local/kind: {{ $kind }}
                    catalog.cluster.local/name: {{ $xrName }}
                  fullnameOverride: {{ $xrName }}
                  useStandardNaming: true
                  apiServer:
                    podDisruptionBudget:
                      enabled: false
                  scheduler:
                    podDisruptionBudget:
                      enabled: false
                  webserver:
                    podDisruptionBudget:
                      enabled: false
                    defaultUser:
                      username: admin
                      password: {{ dig "resources" "helm-release" "resource" "spec" "forProvider" "values" "webserver" "defaultUser" "password" (randAlphaNum 12) .observed }}
                  pgbouncer:
                    podDisruptionBudget:
                      enabled: false
                  ingress:
                    enabled: true
                    web:
                      enabled: true
                      {{- if or ($params.ingress.public) (eq $params.ingress nil) }}
                      ingressClassName: nginx
                      {{- else }}
                      ingressClassName: nginx-internal
                      {{- end }}
                      annotations:
                        kubernetes.io/tls-acme: "true"
                      hosts:
                        - name: {{ $host }}.{{ $zone }}
                          tls:
                            enabled: true
                            secretName: {{ $xrName }}-tls
                  webserverSecretKey: {{ dig "resources" "helm-release" "resource" "spec" "forProvider" "values" "webserverSecretKey" (randAlphaNum 16) .observed }}
            ---
            {{ $values := dig "resources" "helm-release" "resource" "spec" "forProvider" "values" dict .observed }}

            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $xrName }}-connection
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            {{ if eq $.observed.resources nil }}
            data: {}
            {{ else }}
            data:
              {{ if ne $values.ingress nil }}
              host: {{ index $values.ingress.web.hosts 0 "name" | b64enc }}
              {{ end }}
              username: {{ $values.webserver.defaultUser.username | b64enc }}
              password: {{ dig "resources" "helm-release" "resource" "spec" "forProvider" "values" "webserver" "defaultUser" "password" "no value yet" .observed | b64enc }}
            {{ end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
