apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: helmcharts.catalog.cluster.local
spec:
  compositeTypeRef:
    apiVersion: catalog.cluster.local/v2
    kind: HelmChart

  mode: Pipeline
  pipeline:
    - step: helm-chart
      functionRef:
        name: crossplane-contrib-function-go-templating
      # Fetched by Crossplane before the first call.
      requirements:
        requiredResources:
          - requirementName: environment
            apiVersion: apiextensions.crossplane.io/v1beta1
            kind: EnvironmentConfig
            name: environment
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |

            {{ $xr := .observed.composite.resource }}
            {{ $kind := $xr.kind }}
            {{ $xrName := $xr.metadata.name }}
            {{ $namespace := $xr.metadata.namespace }}
            {{ $params := $xr.spec.parameters }}
            {{ $chart := $params.chart }}
            {{ $values := dig "values" "" $params }}
            {{ $secrets := dig "secrets" (list) $params }}
            {{ $environment := dict }}
            {{ with getExtraResources . "environment" }}{{ $environment = dig "resource" "data" (dict) (first .) }}{{ end }}
            {{ $zone := dig "zone" "" $environment }}

            {{/* Public endpoint: a listener on the shared platform gateway. */}}
            {{ $gatewayEnabled := dig "gateway" "enabled" false $params }}
            {{ if and $gatewayEnabled (not $zone) }}
            {{ fail "no platform zone configured, so the instance cannot be exposed publicly" }}
            {{ end }}
            {{/* Hostname = instance name + platform domain (already resolves to the gateway). */}}
            {{ $host := regexReplaceAll "[^a-z0-9-]" ($xrName | lower) "" | trimAll "-" }}
            {{/* DNS labels max 63 chars: shorten with a hash of namespace/name (stable across recreation). */}}
            {{ if gt (len $host) 63 }}
            {{ $host = printf "%s-%s" (trunc 56 $host | trimSuffix "-") (trunc 6 (sha256sum (printf "%s/%s" $namespace $xrName))) }}
            {{ end }}
            {{ $hostname := printf "%s.%s" $host $zone }}
            {{ $endpointURL := printf "https://%s" $hostname }}
            {{ $listenerSetName := printf "%s-listenerset" $xrName }}
            {{ $httpRouteName := printf "%s-httproute" $xrName }}
            {{ $tlsSecretName := printf "%s-tls" $xrName }}
            {{ $gatewayName := dig "gatewayName" "default-gateway" $environment }}
            {{ $gatewayNamespace := dig "gatewayNamespace" "envoy" $environment }}
            {{ $certificateIssuer := dig "certificateIssuer" "letsencrypt" $environment }}

            {{/* Helm release names max 53 chars: shorten the same way. */}}
            {{ $releaseName := $xrName }}
            {{ if gt (len $releaseName) 53 }}
            {{ $releaseName = printf "%s-%s" (trunc 46 $xrName | trimSuffix "-") (trunc 6 (sha256sum (printf "%s/%s" $namespace $xrName))) }}
            {{ end }}
            {{ $valuesSecretName := printf "%s-values" $xrName }}
            {{ $connectionSecretName := printf "%s-connection" $xrName }}

            {{/* User Secrets must not reuse names composed here (the TLS one belongs to cert-manager). */}}
            {{ $reservedSecretNames := dict $valuesSecretName "values" $connectionSecretName "connection details" $tlsSecretName "TLS certificate" }}
            {{ range $secret := $secrets }}
            {{- if hasKey $reservedSecretNames $secret.name }}
            {{- fail (printf "Secret name %q is reserved for this instance's %s" $secret.name (get $reservedSecretNames $secret.name)) }}
            {{- end }}
            {{- end }}

            {{/* Optional backend override: either narrows discovery, both pin it. */}}
            {{ $wantService := dig "gateway" "service" "" $params }}
            {{ $wantPort := dig "gateway" "port" 0 $params | int }}

            {{/* Backend of the live route, so a working route isn't switched or dropped needlessly. */}}
            {{ $previousBackend := dict }}
            {{ $previousRules := dig "resources" "http-route" "resource" "spec" "rules" (list) .observed }}
            {{ if $previousRules }}{{ $previousBackend = dig "backendRefs" (list) (first $previousRules) | first | default (dict) }}{{ end }}
            {{ $previousService := dig "name" "" $previousBackend }}
            {{ $previousPort := dig "port" 0 $previousBackend | int }}

            {{/* Candidate Services, fetched by the ExtraResources requirement below
                 (available one reconcile after they exist). */}}
            {{ $servicesByName := dict }}
            {{ range $item := default (list) (getExtraResources . "chart-services") }}
            {{- $service := $item.resource }}
            {{/* Guard for function-go-templating < v0.13.0, which ignores the namespace on label selectors. */}}
            {{- if eq (dig "metadata" "namespace" "" $service) $namespace }}
            {{- $_ := set $servicesByName $service.metadata.name $service }}
            {{- end }}
            {{- end }}

            {{/* Deterministic order; the Service named after the release first. */}}
            {{ $serviceNames := keys $servicesByName | sortAlpha }}
            {{ if hasKey $servicesByName $releaseName }}{{ $serviceNames = prepend (without $serviceNames $releaseName) $releaseName }}{{ end }}

            {{/* Port ranking (lowest wins, lower port breaks ties):
                   1 appProtocol http, 2 name "http", 3 name "http*", 4 port 80, 5 port 8080,
                   6 front-door word, 7 only TCP port; +50 for a "tcp" name or headless Service.
                 Never discovered (an explicit Port still works): TLS, back-office, data-store ports.
                 Words match by hyphen segment. */}}
            {{ $frontDoorWords := list "console" "web" "ui" "gui" "dashboard" "frontend" "portal" "query" "app" }}
            {{ $backOfficeWords := list "metrics" "telemetry" "otlp" "zipkin" "thrift" "trft" "binary" "grpc" "admin" "debug" "pprof" "health" "probe" "gossip" "peer" "replication" "internal" "sidecar" "management" "webhook" "prometheus" "servicemonitor" "exporter" "reloader" "memberlist" "discovery" }}
            {{ $dataStoreWords := list "postgresql" "postgres" "mysql" "mariadb" "redis" "sentinel" "mongodb" "mongo" "amqp" "kafka" "memcached" "zookeeper" "cassandra" "cql" }}
            {{ $dataStorePorts := list 1433 1521 2181 3306 5432 5672 6379 9042 9092 11211 26379 27017 }}
            {{ $routeService := "" }}
            {{ $routePort := 0 }}
            {{ $bestRank := 99 }}
            {{ $previousRank := 99 }}
            {{ range $serviceName := $serviceNames }}
            {{- $service := get $servicesByName $serviceName }}
            {{- $headless := eq (dig "spec" "clusterIP" "" $service) "None" }}
            {{- $tcpPorts := list }}
            {{- range $port := dig "spec" "ports" (list) $service }}
            {{- if eq (dig "protocol" "TCP" $port) "TCP" }}{{ $tcpPorts = append $tcpPorts $port }}{{ end }}
            {{- end }}
            {{- range $port := $tcpPorts }}
            {{- $portName := dig "name" "" $port | lower }}
            {{- $portNumber := dig "port" 0 $port | int }}
            {{- $appProtocol := dig "appProtocol" "" $port | lower }}
            {{- $words := splitList "-" $portName }}
            {{- $frontDoor := false }}
            {{- $backOffice := false }}
            {{- $dataStore := has $portNumber $dataStorePorts }}
            {{- range $word := $words }}
            {{- if has $word $frontDoorWords }}{{ $frontDoor = true }}{{ end }}
            {{- if has $word $backOfficeWords }}{{ $backOffice = true }}{{ end }}
            {{- if has $word $dataStoreWords }}{{ $dataStore = true }}{{ end }}
            {{- end }}
            {{/* The gateway terminates TLS; it can't reach a TLS backend. ("https" also starts with "http".) */}}
            {{- $tlsPort := or (eq $portName "https") (hasPrefix "https-" $portName) (has $appProtocol (list "https" "kubernetes.io/wss")) (eq $portNumber 443) }}
            {{- $rank := 99 }}
            {{- if $wantPort }}
            {{- if eq $portNumber $wantPort }}{{ $rank = 0 }}{{ end }}
            {{- else if not (or $tlsPort $backOffice $dataStore) }}
            {{- if has $appProtocol (list "http" "kubernetes.io/ws") }}{{ $rank = 1 }}
            {{- else if eq $portName "http" }}{{ $rank = 2 }}
            {{- else if hasPrefix "http" $portName }}{{ $rank = 3 }}
            {{- else if eq $portNumber 80 }}{{ $rank = 4 }}
            {{- else if eq $portNumber 8080 }}{{ $rank = 5 }}
            {{- else if $frontDoor }}{{ $rank = 6 }}
            {{- else if eq (len $tcpPorts) 1 }}{{ $rank = 7 }}
            {{- end }}
            {{- if and (ne $rank 99) (or $headless (has "tcp" $words)) }}{{ $rank = add $rank 50 }}{{ end }}
            {{- end }}
            {{- if and (eq $serviceName $previousService) (eq $portNumber $previousPort) }}{{ $previousRank = $rank }}{{ end }}
            {{- if or (lt $rank $bestRank) (and (eq $rank $bestRank) (ne $rank 99) (lt $portNumber $routePort)) }}
            {{- $bestRank = $rank }}
            {{- $routeService = $serviceName }}
            {{- $routePort = $portNumber }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{ $backendFound := ne $bestRank 99 }}

            {{/* Keep the live backend while it qualifies (a last-resort one yields to a proper one).
                 If nothing qualifies, hold the route instead of taking the endpoint down. */}}
            {{ $routeHeld := and $gatewayEnabled $previousService (not $backendFound) }}
            {{ if or $routeHeld (and (ne $previousRank 99) (or (lt $previousRank 50) (ge $bestRank 50))) }}
            {{ $routeService = $previousService }}
            {{ $routePort = $previousPort }}
            {{ end }}

            {{ $composeRoute := and $gatewayEnabled $routeService }}

            {{/* Listener hostnames are unique across the shared gateway; a taken one is Conflicted. */}}
            {{ $listenerConflict := false }}
            {{ $listenerProblems := list }}
            {{ $listenerSetStatus := dig "resources" "listener-set" "resource" "status" dict .observed }}
            {{ $listenerSetProgrammed := false }}
            {{ range $condition := dig "conditions" (list) $listenerSetStatus }}
            {{- if and (eq (dig "type" "" $condition) "Programmed") (eq (dig "status" "" $condition) "True") }}{{ $listenerSetProgrammed = true }}{{ end }}
            {{- end }}
            {{ range $listener := dig "listeners" (list) $listenerSetStatus }}
            {{- range $condition := dig "conditions" (list) $listener }}
            {{- if and (eq (dig "type" "" $condition) "Conflicted") (eq (dig "status" "" $condition) "True") }}
            {{- $listenerConflict = true }}
            {{- else if and (has (dig "type" "" $condition) (list "Accepted" "Programmed" "ResolvedRefs")) (ne (dig "status" "" $condition) "True") }}
            {{- $listenerProblems = append $listenerProblems (printf "listener %s: %s" $condition.type (dig "message" "" $condition)) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{/* Only advertise an address that serves this instance. */}}
            {{ $endpointLive := and $composeRoute (not $listenerConflict) }}

            {{ $releaseStatus := dig "resources" "helm-release" "resource" "status" dict .observed }}
            {{ $releaseState := dig "atProvider" "state" "" $releaseStatus }}
            {{ $revision := dig "atProvider" "revision" 0 $releaseStatus | int }}
            {{ $version := dig "atProvider" "version" "" $releaseStatus }}

            {{/* Status message. Status is server-side applied, so dropped problems clear themselves. */}}
            {{ $problems := list }}
            {{ range $condition := dig "conditions" (list) $releaseStatus }}
            {{- if and (ne (dig "status" "" $condition) "True") (dig "message" "" $condition) }}
            {{- $problems = append $problems (printf "%s: %s" $condition.type $condition.message) }}
            {{- end }}
            {{- end }}
            {{- if and $releaseState (ne $releaseState "deployed") }}
            {{- $problems = append $problems (printf "release %s: %s" $releaseState (dig "atProvider" "releaseDescription" "" $releaseStatus)) }}
            {{- end }}
            {{- if $gatewayEnabled }}
            {{- if $listenerConflict }}
            {{- $problems = append $problems (printf "hostname %s is taken by another instance; rename this one" $hostname) }}
            {{- else }}
            {{- $problems = concat $problems $listenerProblems }}
            {{- end }}
            {{- if and (not $backendFound) (or $wantService $wantPort) }}
            {{- $wanted := list }}
            {{- if $wantService }}{{ $wanted = append $wanted (printf "Service %s" $wantService) }}{{ end }}
            {{- if $wantPort }}{{ $wanted = append $wanted (printf "port %d" $wantPort) }}{{ end }}
            {{- $problems = append $problems (printf "no backend matches %s" (join ", " $wanted)) }}
            {{- else if not $backendFound }}
            {{- $problems = append $problems "no HTTP Service found; set Public Endpoint Port or Service" }}
            {{- end }}
            {{- if $routeHeld }}
            {{- $problems = append $problems (printf "backend %s:%d gone; keeping the existing route" $routeService $routePort) }}
            {{- end }}
            {{- end }}

            {{/* Accepted doesn't imply the backend resolves; check both. */}}
            {{ $routeStatus := dig "resources" "http-route" "resource" "status" dict .observed }}
            {{ $routeAccepted := false }}
            {{ range $parent := dig "parents" (list) $routeStatus }}
            {{- range $condition := dig "conditions" (list) $parent }}
            {{- if and (eq (dig "type" "" $condition) "Accepted") (eq (dig "status" "" $condition) "True") }}{{ $routeAccepted = true }}{{ end }}
            {{- if and (has (dig "type" "" $condition) (list "Accepted" "ResolvedRefs")) (ne (dig "status" "" $condition) "True") }}
            {{- $problems = append $problems (printf "route %s: %s" $condition.type (dig "message" "" $condition)) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{ $message := $problems | uniq | join "; " | trunc 1024 }}

            {{/* Values in a Secret: may hold credentials. JSON-quoted, so any input stays one valid string. */}}
            {{ if $values }}
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $valuesSecretName }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation "values" }}
            type: Opaque
            stringData:
              values.yaml: {{ $values | toJson }}
            ---
            {{ end }}
            apiVersion: helm.m.crossplane.io/v1beta1
            kind: Release
            metadata:
              name: {{ $releaseName }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                crossplane.io/external-name: {{ $releaseName }}
                {{ setResourceNameAnnotation "helm-release" }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-helm
              forProvider:
                # Ready only once the chart's workloads are.
                wait: true
                chart:
                  repository: {{ $chart.repository | quote }}
                  name: {{ $chart.name | quote }}
                  version: {{ $chart.version | quote }}
                namespace: {{ $namespace }}
                {{- if $values }}
                valuesFrom:
                  - secretKeyRef:
                      name: {{ $valuesSecretName }}
                      key: values.yaml
                {{- end }}

            {{/* User Secrets. Keys quoted: YAML 1.1 would turn "on" or "010" into "true" or "8". */}}
            {{ range $secret := $secrets }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $secret.name }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation (printf "secret-%s" $secret.name) }}
            type: Opaque
            stringData:
            {{- range $entry := $secret.data }}
              {{ $entry.key | quote }}: {{ $entry.value | quote }}
            {{- end }}
            ---
            {{/* Keeps the Secret until the release is uninstalled. */}}
            apiVersion: protection.crossplane.io/v1beta1
            kind: Usage
            metadata:
              name: {{ printf "%s-usage" (regexReplaceAll "[-.]+$" (trunc 247 $secret.name) "") }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation (printf "usage-%s" $secret.name) }}
            spec:
              replayDeletion: true
              of:
                apiVersion: v1
                kind: Secret
                resourceRef:
                  name: {{ $secret.name }}
              by:
                apiVersion: helm.m.crossplane.io/v1beta1
                kind: Release
                resourceRef:
                  name: {{ $releaseName }}
            {{ end }}

            {{ if $gatewayEnabled }}
            ---
            {{/* The named Service, else Services labelled with the release name; this namespace only. */}}
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              chart-services:
                apiVersion: v1
                kind: Service
                namespace: {{ $namespace | quote }}
            {{- if $wantService }}
                matchName: {{ $wantService | quote }}
            {{- else }}
                matchLabels:
                  app.kubernetes.io/instance: {{ $releaseName | quote }}
            {{- end }}

            ---
            {{/* Composed directly (needs Crossplane RBAC for the Gateway API, see README). */}}
            apiVersion: gateway.networking.k8s.io/v1
            kind: ListenerSet
            metadata:
              name: {{ $listenerSetName }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation "listener-set" }}
                gotemplating.fn.crossplane.io/ready: {{ ternary "True" "False" $listenerSetProgrammed | quote }}
                # cert-manager issues the certificate into the TLS Secret.
                cert-manager.io/cluster-issuer: {{ $certificateIssuer | quote }}
            spec:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: {{ $gatewayName | quote }}
                namespace: {{ $gatewayNamespace | quote }}
              listeners:
                - name: https
                  hostname: {{ $hostname | quote }}
                  port: 443
                  protocol: HTTPS
                  allowedRoutes:
                    namespaces:
                      from: Same
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - group: ""
                        kind: Secret
                        name: {{ $tlsSecretName | quote }}

            {{ if $composeRoute }}
            ---
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: {{ $httpRouteName }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation "http-route" }}
                gotemplating.fn.crossplane.io/ready: {{ ternary "True" "False" $routeAccepted | quote }}
            spec:
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: {{ $listenerSetName }}
              hostnames:
                - {{ $hostname | quote }}
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: {{ $routeService | quote }}
                      port: {{ $routePort }}
            {{ end }}
            {{ end }}

            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $connectionSecretName }}
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            data:
              release: {{ $releaseName | b64enc }}
              namespace: {{ $namespace | b64enc }}
              chart: {{ $chart.name | b64enc }}
              version: {{ $chart.version | b64enc }}
            {{ if $endpointLive }}
              host: {{ $hostname | b64enc }}
              url: {{ $endpointURL | b64enc }}
            {{ end }}
            {{ if $releaseState }}
              state: {{ $releaseState | b64enc }}
            {{ end }}

            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            {{- if and $gatewayEnabled (not $endpointLive) }}
            metadata:
              annotations:
                # Endpoint requested but not live: not Ready.
                gotemplating.fn.crossplane.io/ready: "False"
            {{- end }}
            {{- if or $endpointLive $releaseState $version $revision $message }}
            status:
            {{- end }}
            {{- if $endpointLive }}
              url: {{ $endpointURL | quote }}
            {{- end }}
            {{- if $releaseState }}
              state: {{ $releaseState | quote }}
            {{- end }}
            {{- if $version }}
              version: {{ $version | quote }}
            {{- end }}
            {{- if $revision }}
              revision: {{ $revision }}
            {{- end }}
            {{- if $message }}
              message: {{ $message | quote }}
            {{- end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
