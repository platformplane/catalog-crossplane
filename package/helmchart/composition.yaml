apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: helmcharts.catalog.cluster.local
spec:
  compositeTypeRef:
    apiVersion: catalog.cluster.local/v2
    kind: HelmChart
  writeConnectionSecretsToNamespace: crossplane-system

  mode: Pipeline
  pipeline:
    - step: get-environment-configs
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: environment

    - step: helm-chart
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |

            {{ $xr := .observed.composite.resource }}
            {{ $kind := $xr.kind }}
            {{ $xrName := $xr.metadata.name }}
            {{ $namespace := $xr.metadata.namespace }}
            {{ $params := $xr.spec.parameters }}
            {{ $chart := $params.chart }}
            {{ $values := dig "values" "" $params }}
            {{ $secrets := dig "secrets" (list) $params }}
            {{ $environment := index $.context "apiextensions.crossplane.io/environment" }}
            {{ $zone := index $environment "zone" }}

            {{/* Public endpoint: a listener on the platform's shared gateway, not one of its own.
                 Gateway and cert issuer come from the environment. */}}
            {{ $gatewayEnabled := dig "gateway" "enabled" false $params }}
            {{/* Derived, never given: instance name + platform domain, which already resolves to
                 the gateway. */}}
            {{ $host := regexReplaceAll "[^a-z0-9-]" ($xrName | lower) "" | trimAll "-" }}
            {{/* A DNS label holds at most 63 characters; shorten with a hash past that. Hashed from
                 namespace/name rather than the uid, so the address survives recreating the XR. */}}
            {{ if gt (len $host) 63 }}
            {{ $host = printf "%s-%s" (trunc 56 $host | trimSuffix "-") (trunc 6 (sha256sum (printf "%s/%s" $namespace $xrName))) }}
            {{ end }}
            {{ $hostname := printf "%s.%s" $host $zone }}
            {{ $endpointURL := printf "https://%s" $hostname }}
            {{ $listenerSetName := printf "%s-listenerset" $xrName }}
            {{ $httpRouteName := printf "%s-httproute" $xrName }}
            {{ $tlsSecretName := printf "%s-tls" $xrName }}
            {{ $gatewayName := dig "gatewayName" "default-gateway" $environment }}
            {{ $gatewayNamespace := dig "gatewayNamespace" "envoy" $environment }}
            {{ $certificateIssuer := dig "certificateIssuer" "letsencrypt" $environment }}

            {{/* Helm caps release names at 53 characters; shorten with a hash past that, hashed
                 like the hostname so the name survives recreating the XR. */}}
            {{ $releaseName := $xrName }}
            {{ if gt (len $releaseName) 53 }}
            {{ $releaseName = printf "%s-%s" (trunc 46 $xrName | trimSuffix "-") (trunc 6 (sha256sum (printf "%s/%s" $namespace $xrName))) }}
            {{ end }}
            {{ $valuesSecretName := printf "%s-values" $xrName }}

            {{/* Optional backend override. Either one narrows discovery; both together pin it. */}}
            {{ $wantService := dig "gateway" "service" "" $params }}
            {{ $wantPort := dig "gateway" "port" 0 $params | int }}

            {{/* The backend the live route points at, so a working route is neither switched nor
                 dropped just because discovery sees something different this reconcile. */}}
            {{ $previousBackend := dict }}
            {{ $previousRules := dig "resources" "http-route" "resource" "spec" "forProvider" "manifest" "spec" "rules" (list) .observed }}
            {{ if $previousRules }}{{ $previousBackend = dig "backendRefs" (list) (first $previousRules) | first | default (dict) }}{{ end }}
            {{ $previousService := dig "name" "" $previousBackend }}
            {{ $previousPort := dig "port" 0 $previousBackend | int }}

            {{/* Find the chart's Service via the release-name label Helm applies to everything it
                 installs, or by name when one is given. Fetched by the ExtraResources requirement
                 below; appears one reconcile after the chart's Service does. */}}
            {{ $servicesByName := dict }}
            {{ range $item := default (list) (getExtraResources . "chart-services") }}
            {{- $service := $item.resource }}
            {{/* Not namespaced by the function's label selector, so filter here. */}}
            {{- if eq (dig "metadata" "namespace" "" $service) $namespace }}
            {{- $_ := set $servicesByName $service.metadata.name $service }}
            {{- end }}
            {{- end }}

            {{/* Sorted, so ties resolve the same way every time, with the Service named after the
                 release first. */}}
            {{ $serviceNames := keys $servicesByName | sortAlpha }}
            {{ if hasKey $servicesByName $releaseName }}{{ $serviceNames = prepend (without $serviceNames $releaseName) $releaseName }}{{ end }}

            {{/* Rank the HTTP port: appProtocol http, then name "http", then prefixed "http", then
                 80/8080, then a front-door word, then the only port there is. Lowest rank wins,
                 lowest port number breaks ties. Words match by hyphen segment ("query" in
                 "http-query", not "ui" in "fluid"). TLS, back-office and data-store ports are never
                 picked by discovery -- publishing one is worse than no route, and an explicit port
                 still reaches them. A generic "tcp" name or a headless Service is a last resort. */}}
            {{ $frontDoorWords := list "console" "web" "ui" "gui" "dashboard" "frontend" "portal" "query" "app" }}
            {{ $backOfficeWords := list "metrics" "telemetry" "otlp" "zipkin" "thrift" "trft" "binary" "grpc" "admin" "debug" "pprof" "health" "probe" "gossip" "peer" "replication" "internal" "sidecar" "management" "webhook" "prometheus" "servicemonitor" "exporter" "reloader" "memberlist" "discovery" }}
            {{ $dataStoreWords := list "postgresql" "postgres" "mysql" "mariadb" "redis" "sentinel" "mongodb" "mongo" "amqp" "kafka" "memcached" "zookeeper" "cassandra" "cql" }}
            {{ $dataStorePorts := list 1433 1521 2181 3306 5432 5672 6379 9042 9092 11211 26379 27017 }}
            {{ $routeService := "" }}
            {{ $routePort := 0 }}
            {{ $bestRank := 99 }}
            {{ $previousRank := 99 }}
            {{ range $serviceName := $serviceNames }}
            {{- $service := get $servicesByName $serviceName }}
            {{- $headless := eq (dig "spec" "clusterIP" "" $service) "None" }}
            {{- $tcpPorts := list }}
            {{- range $port := dig "spec" "ports" (list) $service }}
            {{- if eq (dig "protocol" "TCP" $port) "TCP" }}{{ $tcpPorts = append $tcpPorts $port }}{{ end }}
            {{- end }}
            {{- range $port := $tcpPorts }}
            {{- $portName := dig "name" "" $port | lower }}
            {{- $portNumber := dig "port" 0 $port | int }}
            {{- $appProtocol := dig "appProtocol" "" $port | lower }}
            {{- $words := splitList "-" $portName }}
            {{- $frontDoor := false }}
            {{- $backOffice := false }}
            {{- $dataStore := has $portNumber $dataStorePorts }}
            {{- range $word := $words }}
            {{- if has $word $frontDoorWords }}{{ $frontDoor = true }}{{ end }}
            {{- if has $word $backOfficeWords }}{{ $backOffice = true }}{{ end }}
            {{- if has $word $dataStoreWords }}{{ $dataStore = true }}{{ end }}
            {{- end }}
            {{/* The gateway terminates TLS and can't reach a TLS port without a BackendTLSPolicy.
                 Note "https" also starts with "http". */}}
            {{- $tlsPort := or (eq $portName "https") (hasPrefix "https-" $portName) (has $appProtocol (list "https" "kubernetes.io/wss")) (eq $portNumber 443) }}
            {{- $rank := 99 }}
            {{- if $wantPort }}
            {{- if eq $portNumber $wantPort }}{{ $rank = 0 }}{{ end }}
            {{- else if not (or $tlsPort $backOffice $dataStore) }}
            {{- if has $appProtocol (list "http" "kubernetes.io/ws") }}{{ $rank = 1 }}
            {{- else if eq $portName "http" }}{{ $rank = 2 }}
            {{- else if hasPrefix "http" $portName }}{{ $rank = 3 }}
            {{- else if eq $portNumber 80 }}{{ $rank = 4 }}
            {{- else if eq $portNumber 8080 }}{{ $rank = 5 }}
            {{- else if $frontDoor }}{{ $rank = 6 }}
            {{- else if eq (len $tcpPorts) 1 }}{{ $rank = 7 }}
            {{- end }}
            {{- if and (ne $rank 99) (or $headless (has "tcp" $words)) }}{{ $rank = add $rank 50 }}{{ end }}
            {{- end }}
            {{- if and (eq $serviceName $previousService) (eq $portNumber $previousPort) }}{{ $previousRank = $rank }}{{ end }}
            {{- if or (lt $rank $bestRank) (and (eq $rank $bestRank) (ne $rank 99) (lt $portNumber $routePort)) }}
            {{- $bestRank = $rank }}
            {{- $routeService = $serviceName }}
            {{- $routePort = $portNumber }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{ $backendFound := ne $bestRank 99 }}

            {{/* Stick with the live backend while it still qualifies; only a last-resort pick gives
                 way, once a proper one shows up (e.g. the chart's main Service syncs later). If
                 nothing qualifies, e.g. the Service is briefly gone during an upgrade, hold the
                 route rather than delete it and take the endpoint down. */}}
            {{ $routeHeld := and $gatewayEnabled $previousService (not $backendFound) }}
            {{ if or $routeHeld (and (ne $previousRank 99) (or (lt $previousRank 50) (ge $bestRank 50))) }}
            {{ $routeService = $previousService }}
            {{ $routePort = $previousPort }}
            {{ end }}

            {{ $routeReady := and $gatewayEnabled $routeService }}

            {{/* Listeners are matched by hostname across every namespace on the shared gateway; a
                 name taken by another instance leaves this one Conflicted. */}}
            {{ $listenerConflict := false }}
            {{ $listenerProblems := list }}
            {{ $listenerSetStatus := dig "resources" "listener-set" "resource" "status" "atProvider" "manifest" "status" dict .observed }}
            {{ range $listener := dig "listeners" (list) $listenerSetStatus }}
            {{- range $condition := dig "conditions" (list) $listener }}
            {{- if and (eq (dig "type" "" $condition) "Conflicted") (eq (dig "status" "" $condition) "True") }}
            {{- $listenerConflict = true }}
            {{- else if and (has (dig "type" "" $condition) (list "Accepted" "Programmed" "ResolvedRefs")) (ne (dig "status" "" $condition) "True") }}
            {{- $listenerProblems = append $listenerProblems (printf "listener %s: %s" $condition.type (dig "message" "" $condition)) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{/* Only advertise an address that serves this instance. */}}
            {{ $endpointLive := and $routeReady (not $listenerConflict) }}

            {{/* Live state is status.atProvider.manifest; forProvider.manifest is only what we
                 asked for and has no status. */}}
            {{ $releaseStatus := dig "resources" "helm-release" "resource" "status" dict .observed }}
            {{ $releaseState := dig "atProvider" "state" "" $releaseStatus }}
            {{ $revision := dig "atProvider" "revision" 0 $releaseStatus | int }}
            {{/* The release carries no chart version, but once it is deployed and in step with the
                 spec, the requested version is the one running. Until then keep the last one seen. */}}
            {{ $version := dig "status" "version" "" $xr }}
            {{ if and (eq $releaseState "deployed") (dig "synced" false $releaseStatus) }}
            {{ $version = $chart.version }}
            {{ end }}

            {{/* Collects why the release is failing. Status is server-side applied, so a message
                 stopped here disappears from the XR too. */}}
            {{ $problems := list }}
            {{ range $condition := dig "conditions" (list) $releaseStatus }}
            {{- if and (ne (dig "status" "" $condition) "True") (dig "message" "" $condition) }}
            {{- $problems = append $problems (printf "%s: %s" $condition.type $condition.message) }}
            {{- end }}
            {{- end }}
            {{- if and $releaseState (ne $releaseState "deployed") }}
            {{- $problems = append $problems (printf "release %s: %s" $releaseState (dig "atProvider" "releaseDescription" "" $releaseStatus)) }}
            {{- end }}
            {{- if $gatewayEnabled }}
            {{- if $listenerConflict }}
            {{- $problems = append $problems (printf "hostname %s is already used by another instance on the platform gateway; rename this instance to get its own" $hostname) }}
            {{- else }}
            {{- $problems = concat $problems $listenerProblems }}
            {{- end }}
            {{- if and (not $backendFound) (or $wantService $wantPort) }}
            {{- $wanted := list }}
            {{- if $wantService }}{{ $wanted = append $wanted (printf "Service %s" $wantService) }}{{ end }}
            {{- if $wantPort }}{{ $wanted = append $wanted (printf "port %d" $wantPort) }}{{ end }}
            {{- $problems = append $problems (printf "nothing matches the Public Endpoint settings (%s), so the endpoint has nothing to route to" (join ", " $wanted)) }}
            {{- else if not $backendFound }}
            {{- $problems = append $problems "no Service with an HTTP port found for this chart yet, so the endpoint has nothing to route to; set Port (and Service) under Public Endpoint to pick one" }}
            {{- end }}
            {{- if $routeHeld }}
            {{- $problems = append $problems (printf "backend %s:%d no longer matches; keeping the existing route until it is back or the Public Endpoint settings point elsewhere" $routeService $routePort) }}
            {{- end }}
            {{- end }}

            {{/* Accepted doesn't mean the backend resolves -- check that too. */}}
            {{ $routeStatus := dig "resources" "http-route" "resource" "status" "atProvider" "manifest" "status" dict .observed }}
            {{ range $parent := dig "parents" (list) $routeStatus }}
            {{- range $condition := dig "conditions" (list) $parent }}
            {{- if and (has (dig "type" "" $condition) (list "Accepted" "ResolvedRefs")) (ne (dig "status" "" $condition) "True") }}
            {{- $problems = append $problems (printf "route %s: %s" $condition.type (dig "message" "" $condition)) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{ $message := $problems | uniq | join "; " | trunc 1024 }}

            {{/* Values go through a Secret rather than inline, so they stay the YAML string the
                 user wrote (no parsing in the template) and may hold credentials. */}}
            {{ if $values }}
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $valuesSecretName }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation "values" }}
            type: Opaque
            stringData:
              values.yaml: |
            {{ $values | nindent 16 }}
            ---
            {{ end }}
            apiVersion: helm.m.crossplane.io/v1beta1
            kind: Release
            metadata:
              name: {{ $releaseName }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                crossplane.io/external-name: {{ $releaseName }}
                gotemplating.fn.crossplane.io/composition-resource-name: "helm-release"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-helm
              forProvider:
                # Ready only once the chart's workloads are, so State reflects their health.
                wait: true
                chart:
                  repository: {{ $chart.repository | quote }}
                  name: {{ $chart.name | quote }}
                  version: {{ $chart.version | quote }}
                namespace: {{ $namespace }}
                {{- if $values }}
                valuesFrom:
                  - secretKeyRef:
                      name: {{ $valuesSecretName }}
                      key: values.yaml
                {{- end }}

            {{/* Secrets the chart expects to exist, so chart and credentials ship as one item. */}}
            {{ range $secret := $secrets }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $secret.name }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation (printf "secret-%s" $secret.name) }}
            type: Opaque
            stringData:
            {{- range $entry := $secret.data }}
              {{ $entry.key }}: {{ $entry.value | quote }}
            {{- end }}
            {{ end }}

            {{ if $gatewayEnabled }}
            ---
            {{/* Fetches the named Service, or else the Services Helm labelled with this
                 instance's release name. */}}
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
            {{- if $wantService }}
              chart-services:
                apiVersion: v1
                kind: Service
                matchName: {{ $wantService | quote }}
                namespace: {{ $namespace | quote }}
            {{- else }}
              chart-services:
                apiVersion: v1
                kind: Service
                matchLabels:
                  app.kubernetes.io/instance: {{ $releaseName | quote }}
            {{- end }}

            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $listenerSetName }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "listener-set"
            spec:
              readiness:
                policy: DeriveFromCelQuery
                celQuery: |
                  has(object.status) &&
                  has(object.status.conditions) &&
                  object.status.conditions.exists(c, c.type == "Programmed" && c.status == "True")
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: gateway.networking.k8s.io/v1
                  kind: ListenerSet
                  metadata:
                    name: {{ $listenerSetName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                    annotations:
                      # cert-manager issues the listener's certificate into the Secret below.
                      cert-manager.io/cluster-issuer: {{ $certificateIssuer | quote }}
                  spec:
                    parentRef:
                      group: gateway.networking.k8s.io
                      kind: Gateway
                      name: {{ $gatewayName | quote }}
                      namespace: {{ $gatewayNamespace | quote }}
                    listeners:
                      - name: https
                        hostname: {{ $hostname | quote }}
                        port: 443
                        protocol: HTTPS
                        allowedRoutes:
                          namespaces:
                            # Only routes in this instance's own namespace may attach to it.
                            from: Same
                        tls:
                          mode: Terminate
                          certificateRefs:
                            - group: ""
                              kind: Secret
                              name: {{ $tlsSecretName | quote }}

            {{ if $routeReady }}
            ---
            {{/* Composed here, not shipped with the chart, so it can't drift from the listener. */}}
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $httpRouteName }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "http-route"
            spec:
              readiness:
                policy: DeriveFromCelQuery
                celQuery: |
                  has(object.status) &&
                  has(object.status.parents) &&
                  object.status.parents.exists(p,
                    has(p.conditions) &&
                    p.conditions.exists(c, c.type == "Accepted" && c.status == "True"))
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: gateway.networking.k8s.io/v1
                  kind: HTTPRoute
                  metadata:
                    name: {{ $httpRouteName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                  spec:
                    parentRefs:
                      - group: gateway.networking.k8s.io
                        kind: ListenerSet
                        name: {{ $listenerSetName }}
                    hostnames:
                      - {{ $hostname | quote }}
                    rules:
                      - backendRefs:
                          - group: ""
                            kind: Service
                            name: {{ $routeService | quote }}
                            port: {{ $routePort }}
            {{ end }}
            {{ end }}

            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $xrName }}-connection
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            data:
              release: {{ $releaseName | b64enc }}
              namespace: {{ $namespace | b64enc }}
              chart: {{ $chart.name | b64enc }}
              version: {{ $chart.version | b64enc }}
            {{ if $endpointLive }}
              host: {{ $hostname | b64enc }}
              url: {{ $endpointURL | b64enc }}
            {{ end }}
            {{ if $releaseState }}
              state: {{ $releaseState | b64enc }}
            {{ end }}

            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            {{- if and $gatewayEnabled (not $endpointLive) }}
            metadata:
              annotations:
                # Asked for an endpoint and there is none (yet), so the XR is not Ready either.
                gotemplating.fn.crossplane.io/ready: "False"
            {{- end }}
            {{- if or $endpointLive $releaseState $version $revision $message }}
            status:
            {{- end }}
            {{- if $endpointLive }}
              url: {{ $endpointURL | quote }}
            {{- end }}
            {{- if $releaseState }}
              state: {{ $releaseState | quote }}
            {{- end }}
            {{- if $version }}
              version: {{ $version | quote }}
            {{- end }}
            {{- if $revision }}
              revision: {{ $revision }}
            {{- end }}
            {{- if $message }}
              message: {{ $message | quote }}
            {{- end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready

