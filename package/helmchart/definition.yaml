apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: helmcharts.catalog.cluster.local
spec:
  group: catalog.cluster.local
  defaultCompositionUpdatePolicy: Manual
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: HelmChart
    annotations:
      catalog.cluster.local/title: "Helm Chart"
      catalog.cluster.local/description: "Deploy any Helm chart, with optional Secrets and a public HTTPS endpoint."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://helm.sh/docs/"
      catalog.cluster.local/tags: "helm,generic,deployment"
  names:
    kind: HelmChart
    plural: helmcharts
  versions:
    - name: v2
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Version
          type: string
          jsonPath: .status.version
        - name: Revision
          type: integer
          jsonPath: .status.revision
          priority: 1
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          description: A Helm release in this namespace.
          type: object
          properties:
            spec:
              description: Release configuration.
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  properties:
                    chart:
                      type: object
                      title: "Chart"
                      description: "Chart to deploy."
                      properties:
                        repository:
                          type: string
                          title: "Repository"
                          description: "https:// or oci:// URL."
                          minLength: 1
                          maxLength: 2048
                          pattern: '^(https://|oci://)\S+$'
                        name:
                          type: string
                          title: "Chart Name"
                          description: "Chart name in the repository."
                          minLength: 1
                          maxLength: 253
                        version:
                          type: string
                          title: "Chart Version"
                          description: "Chart version to install."
                          minLength: 1
                          maxLength: 253
                      required:
                        - repository
                        - name
                        - version
                    secrets:
                      type: array
                      title: "Secrets"
                      description: "Secrets the chart needs. Reference them from Values, e.g. existingSecret: my-secret. Stored in plain text."
                      maxItems: 16
                      # Rejects duplicate names.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - name
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            title: "Secret Name"
                            description: "Must differ from Secrets the chart creates and from <instance>-values, -connection and -tls."
                            minLength: 1
                            maxLength: 253
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                          data:
                            type: array
                            title: "Data"
                            description: "Key/value entries."
                            minItems: 1
                            maxItems: 64
                            # Rejects duplicate keys.
                            x-kubernetes-list-type: map
                            x-kubernetes-list-map-keys:
                              - key
                            items:
                              type: object
                              properties:
                                key:
                                  type: string
                                  title: "Key"
                                  description: "e.g. password"
                                  minLength: 1
                                  maxLength: 253
                                  pattern: "^[-._a-zA-Z0-9]+$"
                                value:
                                  type: string
                                  title: "Value"
                                  description: "Plain text, not base64."
                                  maxLength: 32768
                              required:
                                - key
                                - value
                        required:
                          - name
                          - data
                    gateway:
                      type: object
                      title: "Public Endpoint"
                      description: "The Service and port are detected automatically, which works for most charts. If detection fails or picks the wrong Service, the status message says so: set Service and Port."
                      default: {}
                      properties:
                        enabled:
                          type: boolean
                          default: false
                          title: "Expose Publicly"
                          description: "Publish at https://<instance>.<platform domain>, without authentication. Disable the chart's own ingress."
                        port:
                          type: integer
                          title: "Port"
                          description: "Plain-HTTP Service port. Empty: detected."
                          minimum: 1
                          maximum: 65535
                        service:
                          type: string
                          title: "Service"
                          description: "Service name. Empty: detected among the chart's Services."
                          maxLength: 63
                          pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
                    values:
                      type: string
                      format: codearea
                      title: "Values"
                      description: "Helm values as YAML, merged over the chart defaults. When exposed publicly, ${PUBLIC_URL} and ${PUBLIC_HOST} are replaced with the public address. Custom routing: see [HTTPRoute](https://gateway-api.sigs.k8s.io/api-types/httproute/)."
                      maxLength: 65536
                  required:
                    - chart
              required:
                - parameters
            status:
              description: Live release state.
              type: object
              properties:
                state:
                  type: string
                  title: "State"
                  description: "Helm release state, e.g. deployed or failed."
                version:
                  type: string
                  title: "Deployed Version"
                  description: "Chart version currently deployed."
                revision:
                  type: integer
                  title: "Revision"
                  description: "Helm release revision."
                message:
                  type: string
                  title: "Message"
                  description: "What is wrong with the release or endpoint. Empty when healthy."
                url:
                  type: string
                  title: "Public Endpoint"
                  description: "Public URL, set once the endpoint serves traffic."

