apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: keycloaks.catalog.cluster.local
spec:
  group: catalog.cluster.local
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: Keycloak
    annotations:
      catalog.cluster.local/title: "Keycloak"
      catalog.cluster.local/description: "Keycloak identity and access management: single sign-on with OpenID Connect and SAML, user federation and identity brokering. Realms, clients, users and email are configured in the Keycloak admin console."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://www.keycloak.org/"
      catalog.cluster.local/tags: "identity,sso,oidc,saml,unmanaged,helm"
  names:
    kind: Keycloak
    plural: keycloaks
  versions:
    - name: v2
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.parameters.version
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          description: Keycloak server with a small bundled PostgreSQL database, published at <instance name>.<platform domain>. Everything Keycloak can configure itself is left to its admin console.
          type: object
          properties:
            spec:
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  default: {}
                  properties:
                    version:
                      type: string
                      title: "Version"
                      description: "Keycloak version."
                      default: "26.8.1"
                      enum:
                        - "26.8.1"
                    size:
                      type: string
                      title: "Storage Size"
                      description: "Database volume size. Can be increased later, not decreased."
                      default: "1Gi"
                      pattern: ^(?<size>\d+(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?)$
                    resourceProfile:
                      type: string
                      title: "Resource Profile"
                      description: "Keycloak server size: small 0.5-1 CPU, 1 GiB RAM; medium 1-2 CPU, 2 GiB RAM; large 2-4 CPU, 4 GiB RAM."
                      default: "small"
                      enum:
                        - small
                        - medium
                        - large
              required:
                - parameters
            status:
              description: Live state, read from the composed resources.
              type: object
              properties:
                url:
                  type: string
                  title: "URL"
                  description: "Public address. Absent until the listener and route are live, or while the hostname is taken by another instance."
                message:
                  type: string
                  title: "Message"
                  description: "Why the instance is not working. Empty when all is well."
