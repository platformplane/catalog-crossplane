apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: argohelmcharts.catalog.cluster.local
spec:
  compositeTypeRef:
    apiVersion: catalog.cluster.local/v2
    kind: ArgoHelmChart
  writeConnectionSecretsToNamespace: crossplane-system

  mode: Pipeline
  pipeline:
    - step: get-environment-configs
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: environment

    - step: argo-helm-chart
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |

            {{ $xr := .observed.composite.resource }}
            {{ $kind := $xr.kind }}
            {{ $xrName := $xr.metadata.name }}
            {{ $namespace := $xr.metadata.namespace }}
            {{ $params := $xr.spec.parameters }}
            {{ $chart := $params.chart }}
            {{ $values := dig "values" "" $params }}
            {{ $secrets := dig "secrets" (list) $params }}
            {{ $zone := index $.context "apiextensions.crossplane.io/environment" "zone" }}

            {{/* ArgoCD Applications all live in the single shared "argocd" namespace across every
                 tenant, so the name must be unique cluster-wide -- unlike a normal composed resource,
                 which only needs to be unique within the XR's own namespace. Keep the readable
                 "<namespace>-<name>" form when it fits, otherwise fall back to a stable hash suffix. */}}
            {{ $rawAppName := printf "%s-%s" $namespace $xrName }}
            {{ $appName := $rawAppName }}
            {{ if gt (len $rawAppName) 53 }}
            {{ $postfix := trunc 6 (sha256sum (printf "%s" $xr.metadata.uid)) }}
            {{ $appName = printf "%s-%s" (trunc 46 $rawAppName | trimSuffix "-") $postfix }}
            {{ end }}

            {{/* Live Application state as of the previous reconcile. provider-kubernetes writes what
                 it observed to status.atProvider.manifest; spec.forProvider.manifest is only the
                 manifest we asked for and never carries a status of its own. */}}
            {{ $appStatus := dig "resources" "argocd-application" "resource" "status" "atProvider" "manifest" "status" dict .observed }}
            {{ $syncStatus := dig "sync" "status" "" $appStatus }}
            {{ $healthStatus := dig "health" "status" "" $appStatus }}
            {{ $revision := dig "sync" "revision" "" $appStatus }}

            {{/* Why the chart is not where it should be, in the order ArgoCD reports it: a bad spec
                 or a chart it cannot compare, then a sync that failed, then a workload that came up
                 unhealthy. Stays empty while all is well -- Crossplane patches the XR status with
                 server-side apply, so a message we stop emitting is removed from the XR again. */}}
            {{ $problems := list }}
            {{ range $condition := dig "conditions" (list) $appStatus }}
            {{- if contains "Error" (dig "type" "" $condition) }}
            {{- $problems = append $problems (printf "%s: %s" $condition.type (dig "message" "" $condition)) }}
            {{- end }}
            {{- end }}
            {{ $syncPhase := dig "operationState" "phase" "" $appStatus }}
            {{- if and $syncPhase (not (has $syncPhase (list "Succeeded" "Running"))) }}
            {{- $problems = append $problems (printf "last sync %s: %s" $syncPhase (dig "operationState" "message" "" $appStatus)) }}
            {{- end }}
            {{ $healthMessage := dig "health" "message" "" $appStatus }}
            {{- if and $healthMessage (ne $healthStatus "Healthy") }}
            {{- $problems = append $problems $healthMessage }}
            {{- end }}
            {{ $message := $problems | uniq | join "; " | trunc 1024 }}

            {{/* Assumes ArgoCD runs with Applications restricted to its own control-plane namespace
                 (the platform default). If "applications in any namespace" is ever enabled for this
                 cluster, the UI route gains a namespace segment and this link needs updating. */}}
            {{ $applicationURL := printf "https://argocd.%s/applications/%s" $zone $appName }}

            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $appName }}-application
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "argocd-application"
            spec:
              readiness:
                policy: DeriveFromCelQuery
                celQuery: |
                  has(object.status) &&
                  has(object.status.sync) &&
                  object.status.sync.status == "Synced"
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: {{ $appName }}
                    namespace: argocd
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      catalog.cluster.local/namespace: {{ $namespace }}
                    finalizers:
                      - resources-finalizer.argocd.argoproj.io
                  spec:
                    project: default
                    source:
                      repoURL: {{ $chart.repository | quote }}
                      chart: {{ $chart.name | quote }}
                      targetRevision: {{ $chart.version | quote }}
                      {{ if $values }}
                      helm:
                        values: |
            {{ $values | nindent 26 }}
                      {{ end }}
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: {{ $namespace }}
                    # Auto-sync: ArgoCD applies chart/value changes on its own (no manual "Sync"
                    # click needed), self-heals drift back to this spec, and prunes resources that
                    # a chart change removes.
                    syncPolicy:
                      automated:
                        selfHeal: true
                        prune: true
                      syncOptions:
                        - CreateNamespace=true

            {{/* Secrets the chart expects to already exist in its namespace, declared on the XR so
                 the chart and its credentials are one catalog item. They are composed in the same
                 reconcile as the Application, so ArgoCD can briefly sync a chart whose Secret has
                 not landed yet; it retries on its own and the workload recovers once it has. */}}
            {{ range $secret := $secrets }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $secret.name }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation (printf "secret-%s" $secret.name) }}
            type: Opaque
            stringData:
            {{- range $entry := $secret.data }}
              {{ $entry.key }}: {{ $entry.value | quote }}
            {{- end }}
            {{ end }}

            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $xrName }}-connection
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            data:
              application: {{ $appName | b64enc }}
              namespace: {{ $namespace | b64enc }}
              chart: {{ $chart.name | b64enc }}
              version: {{ $chart.version | b64enc }}
              # Link to the ArgoCD Application, which holds the full sync log and the live
              # resource tree. The XR's own status carries the sync state, health, deployed
              # version, and the reason for a failed sync.
              argocd-url: {{ $applicationURL | b64enc }}
            {{ if $syncStatus }}
              sync-status: {{ $syncStatus | b64enc }}
            {{ end }}
            {{ if $healthStatus }}
              health-status: {{ $healthStatus | b64enc }}
            {{ end }}

            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            status:
              argocd-url: {{ $applicationURL | quote }}
            {{- if $syncStatus }}
              sync: {{ $syncStatus | quote }}
            {{- end }}
            {{- if $healthStatus }}
              health: {{ $healthStatus | quote }}
            {{- end }}
            {{- if $revision }}
              revision: {{ $revision | quote }}
            {{- end }}
            {{- if $message }}
              message: {{ $message | quote }}
            {{- end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
