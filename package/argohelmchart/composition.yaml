apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: argohelmcharts.catalog.cluster.local
spec:
  compositeTypeRef:
    apiVersion: catalog.cluster.local/v2
    kind: ArgoHelmChart
  writeConnectionSecretsToNamespace: crossplane-system

  mode: Pipeline
  pipeline:
    - step: get-environment-configs
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: environment

    - step: argo-helm-chart
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |

            {{ $xr := .observed.composite.resource }}
            {{ $kind := $xr.kind }}
            {{ $xrName := $xr.metadata.name }}
            {{ $namespace := $xr.metadata.namespace }}
            {{ $params := $xr.spec.parameters }}
            {{ $chart := $params.chart }}
            {{ $values := dig "values" "" $params }}
            {{ $secrets := dig "secrets" (list) $params }}
            {{ $environment := index $.context "apiextensions.crossplane.io/environment" }}
            {{ $zone := index $environment "zone" }}

            {{/* Public endpoint: a listener on the platform's shared gateway, not one of its own.
                 Gateway and cert issuer come from the environment. */}}
            {{ $gatewayEnabled := dig "gateway" "enabled" false $params }}
            {{/* Derived, never given: instance name + platform domain, which already resolves to
                 the gateway. */}}
            {{ $host := regexReplaceAll "[^a-z0-9-]" ($xrName | lower) "" }}
            {{ $hostname := printf "%s.%s" $host $zone }}
            {{ $endpointURL := printf "https://%s" $hostname }}
            {{ $listenerSetName := printf "%s-listenerset" $xrName }}
            {{ $httpRouteName := printf "%s-httproute" $xrName }}
            {{ $tlsSecretName := printf "%s-tls" $xrName }}
            {{ $gatewayName := dig "gatewayName" "default-gateway" $environment }}
            {{ $gatewayNamespace := dig "gatewayNamespace" "envoy" $environment }}
            {{ $certificateIssuer := dig "certificateIssuer" "letsencrypt" $environment }}

            {{/* Applications share one "argocd" namespace across all tenants, so the name must be
                 unique cluster-wide; fall back to a hash suffix if the readable form is too long. */}}
            {{ $rawAppName := printf "%s-%s" $namespace $xrName }}
            {{ $appName := $rawAppName }}
            {{ if gt (len $rawAppName) 53 }}
            {{ $postfix := trunc 6 (sha256sum (printf "%s" $xr.metadata.uid)) }}
            {{ $appName = printf "%s-%s" (trunc 46 $rawAppName | trimSuffix "-") $postfix }}
            {{ end }}

            {{ $routeService := "" }}
            {{ $routePort := 0 }}
            {{/* Find the chart's Service via the release-name label Helm applies to everything it
                 installs. Fetched by the ExtraResources requirement below; appears one reconcile
                 after the chart's Service does. */}}
            {{ $chartServices := list }}
            {{ range $item := default (list) (getExtraResources . "chart-services") }}
            {{- $service := $item.resource }}
            {{/* Not namespaced by the function's selector, so filter here. */}}
            {{- if eq (dig "metadata" "namespace" "" $service) $namespace }}
            {{- $chartServices = append $chartServices $service }}
            {{- end }}
            {{- end }}

            {{/* Prefer the Service named after the release when there are several. */}}
            {{ $orderedServices := list }}
            {{ range $service := $chartServices }}{{ if eq $service.metadata.name $appName }}{{ $orderedServices = append $orderedServices $service }}{{ end }}{{ end }}
            {{ range $service := $chartServices }}{{ if ne $service.metadata.name $appName }}{{ $orderedServices = append $orderedServices $service }}{{ end }}{{ end }}

            {{/* Rank the HTTP port: appProtocol http, then name "http", then prefixed "http", then
                 80/8080, then a front-door word, then the only port there is. Lowest rank wins,
                 lowest port number breaks ties. Words match by hyphen segment ("query" in
                 "http-query", not "ui" in "fluid"). Back-office words (metrics, telemetry, ...)
                 are demoted rather than excluded. */}}
            {{ $frontDoorWords := list "console" "web" "ui" "gui" "dashboard" "frontend" "portal" "query" "app" }}
            {{ $backOfficeWords := list "metrics" "telemetry" "otlp" "zipkin" "thrift" "trft" "binary" "grpc" "admin" "debug" "pprof" "health" "probe" "gossip" "peer" "replication" "internal" "sidecar" }}
            {{ $bestRank := 99 }}
            {{ range $service := $orderedServices }}
            {{/* A single TCP port needs no naming convention. */}}
            {{- $tcpPorts := list }}
            {{- range $port := dig "spec" "ports" (list) $service }}
            {{- if ne (dig "protocol" "TCP" $port) "UDP" }}{{ $tcpPorts = append $tcpPorts $port }}{{ end }}
            {{- end }}
            {{- range $port := dig "spec" "ports" (list) $service }}
            {{- $portName := dig "name" "" $port }}
            {{- $portNumber := dig "port" 0 $port | int }}
            {{- $words := splitList "-" (lower $portName) }}
            {{- $frontDoor := false }}
            {{- range $word := $frontDoorWords }}{{ if has $word $words }}{{ $frontDoor = true }}{{ end }}{{ end }}
            {{- $backOffice := false }}
            {{- range $word := $backOfficeWords }}{{ if has $word $words }}{{ $backOffice = true }}{{ end }}{{ end }}
            {{/* Exclude TLS ports: the gateway terminates TLS and can't reach one without a
                 BackendTLSPolicy. Note "https" also starts with "http". */}}
            {{- $tlsPort := or (eq $portName "https") (hasPrefix "https-" $portName) (eq (dig "appProtocol" "" $port | lower) "https") (eq $portNumber 443) }}
            {{- $rank := 99 }}
            {{- if and (ne (dig "protocol" "TCP" $port) "UDP") (not $tlsPort) }}
            {{- if eq (dig "appProtocol" "" $port | lower) "http" }}{{ $rank = 1 }}
            {{- else if eq $portName "http" }}{{ $rank = 2 }}
            {{- else if hasPrefix "http" $portName }}{{ $rank = 3 }}
            {{- else if eq $portNumber 80 }}{{ $rank = 4 }}
            {{- else if eq $portNumber 8080 }}{{ $rank = 5 }}
            {{- else if $frontDoor }}{{ $rank = 6 }}
            {{- else if eq (len $tcpPorts) 1 }}{{ $rank = 7 }}
            {{- end }}
            {{/* Last resort, but still better than no route. */}}
            {{- if and $backOffice (ne $rank 99) }}{{ $rank = add $rank 50 }}{{ end }}
            {{- end }}
            {{- if or (lt $rank $bestRank) (and (eq $rank $bestRank) (ne $rank 99) (lt $portNumber $routePort)) }}
            {{- $bestRank = $rank }}
            {{- $routeService = $service.metadata.name }}
            {{- $routePort = $portNumber }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq $bestRank 99 }}{{ $routeService = "" }}{{ $routePort = 0 }}{{ end }}

            {{ $routeReady := and $gatewayEnabled $routeService (gt $routePort 0) }}

            {{/* Live state is status.atProvider.manifest; forProvider.manifest is only what we
                 asked for and has no status. */}}
            {{ $appStatus := dig "resources" "argocd-application" "resource" "status" "atProvider" "manifest" "status" dict .observed }}
            {{ $syncStatus := dig "sync" "status" "" $appStatus }}
            {{ $healthStatus := dig "health" "status" "" $appStatus }}
            {{ $revision := dig "sync" "revision" "" $appStatus }}

            {{/* Collects why sync/health is failing. Status is server-side applied, so a message
                 stopped here disappears from the XR too. */}}
            {{ $problems := list }}
            {{ range $condition := dig "conditions" (list) $appStatus }}
            {{- if contains "Error" (dig "type" "" $condition) }}
            {{- $problems = append $problems (printf "%s: %s" $condition.type (dig "message" "" $condition)) }}
            {{- end }}
            {{- end }}
            {{ $syncPhase := dig "operationState" "phase" "" $appStatus }}
            {{- if and $syncPhase (not (has $syncPhase (list "Succeeded" "Running"))) }}
            {{- $problems = append $problems (printf "last sync %s: %s" $syncPhase (dig "operationState" "message" "" $appStatus)) }}
            {{- end }}
            {{ $healthMessage := dig "health" "message" "" $appStatus }}
            {{- if and $healthMessage (ne $healthStatus "Healthy") }}
            {{- $problems = append $problems $healthMessage }}
            {{- end }}
            {{- if and $gatewayEnabled (not $routeReady) }}
            {{- $problems = append $problems "no Service with an HTTP port found for this chart yet, so the endpoint has nothing to route to" }}
            {{- end }}

            {{/* Accepted doesn't mean the backend resolves -- check that too. */}}
            {{ $routeStatus := dig "resources" "http-route" "resource" "status" "atProvider" "manifest" "status" dict .observed }}
            {{ range $parent := dig "parents" (list) $routeStatus }}
            {{- range $condition := dig "conditions" (list) $parent }}
            {{- if and (has (dig "type" "" $condition) (list "Accepted" "ResolvedRefs")) (ne (dig "status" "" $condition) "True") }}
            {{- $problems = append $problems (printf "route %s: %s" $condition.type (dig "message" "" $condition)) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{ $message := $problems | uniq | join "; " | trunc 1024 }}

            {{/* Assumes Applications stay in ArgoCD's own namespace; update if that changes. */}}
            {{ $applicationURL := printf "https://argocd.%s/applications/%s" $zone $appName }}

            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $appName }}-application
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "argocd-application"
            spec:
              readiness:
                policy: DeriveFromCelQuery
                celQuery: |
                  has(object.status) &&
                  has(object.status.sync) &&
                  object.status.sync.status == "Synced"
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: {{ $appName }}
                    namespace: argocd
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                      catalog.cluster.local/namespace: {{ $namespace }}
                    finalizers:
                      - resources-finalizer.argocd.argoproj.io
                  spec:
                    project: default
                    source:
                      repoURL: {{ $chart.repository | quote }}
                      chart: {{ $chart.name | quote }}
                      targetRevision: {{ $chart.version | quote }}
                      {{ if $values }}
                      helm:
                        values: |
            {{ $values | nindent 26 }}
                      {{ end }}
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: {{ $namespace }}
                    # Auto-sync: applies changes, self-heals drift, prunes removed resources.
                    syncPolicy:
                      automated:
                        selfHeal: true
                        prune: true
                      syncOptions:
                        - CreateNamespace=true

            {{/* Secrets the chart expects to exist, so chart and credentials ship as one item. */}}
            {{ range $secret := $secrets }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $secret.name }}
              namespace: {{ $namespace }}
              labels:
                catalog.cluster.local/kind: {{ $kind }}
                catalog.cluster.local/name: {{ $xrName }}
              annotations:
                {{ setResourceNameAnnotation (printf "secret-%s" $secret.name) }}
            type: Opaque
            stringData:
            {{- range $entry := $secret.data }}
              {{ $entry.key }}: {{ $entry.value | quote }}
            {{- end }}
            {{ end }}

            {{ if $gatewayEnabled }}
            ---
            {{/* Fetches Services Helm labelled with this instance's release name. */}}
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              chart-services:
                apiVersion: v1
                kind: Service
                matchLabels:
                  app.kubernetes.io/instance: {{ $appName | quote }}

            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $listenerSetName }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "listener-set"
            spec:
              readiness:
                policy: DeriveFromCelQuery
                celQuery: |
                  has(object.status) &&
                  has(object.status.conditions) &&
                  object.status.conditions.exists(c, c.type == "Programmed" && c.status == "True")
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: gateway.networking.k8s.io/v1
                  kind: ListenerSet
                  metadata:
                    name: {{ $listenerSetName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                    annotations:
                      # Groups this under the Application's resource tree and health in the ArgoCD
                      # UI. Not applied by ArgoCD's sync, so it's never diffed or pruned by it --
                      # Crossplane still owns creating, updating and deleting it.
                      argocd.argoproj.io/tracking-id: {{ printf "%s:gateway.networking.k8s.io/ListenerSet:%s/%s" $appName $namespace $listenerSetName | quote }}
                      # cert-manager issues the listener's certificate into the Secret below.
                      cert-manager.io/cluster-issuer: {{ $certificateIssuer | quote }}
                  spec:
                    parentRef:
                      group: gateway.networking.k8s.io
                      kind: Gateway
                      name: {{ $gatewayName | quote }}
                      namespace: {{ $gatewayNamespace | quote }}
                    listeners:
                      - name: https
                        hostname: {{ $hostname | quote }}
                        port: 443
                        protocol: HTTPS
                        allowedRoutes:
                          namespaces:
                            # Only routes in this instance's own namespace may attach to it.
                            from: Same
                        tls:
                          mode: Terminate
                          certificateRefs:
                            - group: ""
                              kind: Secret
                              name: {{ $tlsSecretName | quote }}

            {{ if $routeReady }}
            ---
            {{/* Composed here, not shipped with the chart, so it can't drift from the listener. */}}
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ $httpRouteName }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: "http-route"
            spec:
              readiness:
                policy: DeriveFromCelQuery
                celQuery: |
                  has(object.status) &&
                  has(object.status.parents) &&
                  object.status.parents.exists(p,
                    has(p.conditions) &&
                    p.conditions.exists(c, c.type == "Accepted" && c.status == "True"))
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes
              forProvider:
                manifest:
                  apiVersion: gateway.networking.k8s.io/v1
                  kind: HTTPRoute
                  metadata:
                    name: {{ $httpRouteName }}
                    namespace: {{ $namespace }}
                    labels:
                      catalog.cluster.local/kind: {{ $kind }}
                      catalog.cluster.local/name: {{ $xrName }}
                    annotations:
                      # See the ListenerSet's identical annotation above: grouping only, not sync.
                      argocd.argoproj.io/tracking-id: {{ printf "%s:gateway.networking.k8s.io/HTTPRoute:%s/%s" $appName $namespace $httpRouteName | quote }}
                  spec:
                    parentRefs:
                      - group: gateway.networking.k8s.io
                        kind: ListenerSet
                        name: {{ $listenerSetName }}
                    hostnames:
                      - {{ $hostname | quote }}
                    rules:
                      - backendRefs:
                          - group: ""
                            kind: Service
                            name: {{ $routeService | quote }}
                            port: {{ $routePort }}
            {{ end }}
            {{ end }}

            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $xrName }}-connection
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            data:
              application: {{ $appName | b64enc }}
              namespace: {{ $namespace | b64enc }}
              chart: {{ $chart.name | b64enc }}
              version: {{ $chart.version | b64enc }}
              # Link to the ArgoCD Application; XR status carries sync state, health, version.
              argocd-url: {{ $applicationURL | b64enc }}
            {{ if $gatewayEnabled }}
              host: {{ $hostname | b64enc }}
              url: {{ $endpointURL | b64enc }}
            {{ end }}
            {{ if $syncStatus }}
              sync-status: {{ $syncStatus | b64enc }}
            {{ end }}
            {{ if $healthStatus }}
              health-status: {{ $healthStatus | b64enc }}
            {{ end }}

            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            status:
              argocd-url: {{ $applicationURL | quote }}
            {{- if $gatewayEnabled }}
              url: {{ $endpointURL | quote }}
            {{- end }}
            {{- if $syncStatus }}
              sync: {{ $syncStatus | quote }}
            {{- end }}
            {{- if $healthStatus }}
              health: {{ $healthStatus | quote }}
            {{- end }}
            {{- if $revision }}
              revision: {{ $revision | quote }}
            {{- end }}
            {{- if $message }}
              message: {{ $message | quote }}
            {{- end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
