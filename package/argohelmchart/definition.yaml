apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: argohelmcharts.catalog.cluster.local
spec:
  group: catalog.cluster.local
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: ArgoHelmChart
    annotations:
      catalog.cluster.local/title: "Argo Helm Chart"
      catalog.cluster.local/description: "Deploy any Helm chart from a repository or OCI registry, auto-synced by ArgoCD. Optionally ship the Secrets it needs, and expose it publicly with one flag."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://argo-cd.readthedocs.io/en/stable/user-guide/helm/"
      catalog.cluster.local/tags: "helm,gitops,argocd,argo,generic,deployment"
  names:
    kind: ArgoHelmChart
    plural: argohelmcharts
  versions:
    - name: v2
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: Sync
          type: string
          jsonPath: .status.sync
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Version
          type: string
          jsonPath: .status.revision
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          description: Deploys a Helm chart via an auto-syncing ArgoCD Application.
          type: object
          properties:
            spec:
              description: Helm chart deployment configuration.
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  properties:
                    chart:
                      type: object
                      title: "Chart"
                      description: "Chart to deploy."
                      properties:
                        repository:
                          type: string
                          title: "Repository"
                          description: "Chart repository URL: https:// or oci://."
                          minLength: 1
                          maxLength: 2048
                          pattern: '^(https://|oci://)\S+$'
                        name:
                          type: string
                          title: "Chart Name"
                          description: "Chart name within the repository."
                          minLength: 1
                          maxLength: 253
                        version:
                          type: string
                          title: "Chart Version"
                          description: "Chart version. Change it to roll out a new one."
                          minLength: 1
                          maxLength: 253
                      required:
                        - repository
                        - name
                        - version
                    secrets:
                      type: array
                      title: "Secrets"
                      description: 'Secrets to create alongside the chart. Add a Secret, then one entry per key it should hold, and point the chart at it from Values (e.g. "auth:\n  existingSecret: my-chart-auth"). Stored in plain text.'
                      maxItems: 16
                      # Keyed by name, so Kubernetes itself rejects the same Secret name twice.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - name
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            title: "Secret Name"
                            description: "Secret name. Must not collide with one the chart creates itself."
                            minLength: 1
                            maxLength: 253
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                          data:
                            type: array
                            title: "Data"
                            description: "This Secret's entries, one key/value per row."
                            minItems: 1
                            maxItems: 64
                            # Keyed by key, so the same key cannot be given twice in one Secret.
                            x-kubernetes-list-type: map
                            x-kubernetes-list-map-keys:
                              - key
                            items:
                              type: object
                              properties:
                                key:
                                  type: string
                                  title: "Key"
                                  description: "Entry key, e.g. password or api.key."
                                  minLength: 1
                                  maxLength: 253
                                  pattern: "^[-._a-zA-Z0-9]+$"
                                value:
                                  type: string
                                  title: "Value"
                                  description: "Entry value, written verbatim (do not base64-encode)."
                                  maxLength: 32768
                              required:
                                - key
                                - value
                        required:
                          - name
                          - data
                    gateway:
                      type: object
                      title: "Public Endpoint"
                      default: {}
                      properties:
                        enabled:
                          type: boolean
                          default: false
                          title: "Expose Publicly"
                          description: 'Publish this instance at <instance name>.<platform domain>. Listener, certificate and route are set up automatically, including finding the chart''s HTTP port. Reachable from the internet -- turn off the chart''s own ingress/route to avoid a second address.'
                    values:
                      type: string
                      format: codearea
                      title: "Values"
                      # TODO: point this at the real HTTPRoute documentation once it is published.
                      description: "Helm value overrides, as YAML (e.g. \"service:\\n  type: ClusterIP\"). Merged over the chart's defaults. See [the HTTPRoute documentation](https://example.com/docs/httproute) for manual routing."
                      maxLength: 65536
                  required:
                    - chart
              required:
                - parameters
            status:
              description: Live state, read from the ArgoCD Application.
              type: object
              properties:
                sync:
                  type: string
                  title: "Sync Status"
                  description: "Synced, OutOfSync, or Unknown. See Message if stuck OutOfSync."
                health:
                  type: string
                  title: "Health"
                  description: "Healthy, Progressing, Degraded, Suspended, Missing, or Unknown."
                revision:
                  type: string
                  title: "Deployed Version"
                  description: "Chart version last rolled out; trails the requested one during a rollout."
                message:
                  type: string
                  title: "Message"
                  description: "Why sync or health is failing. Empty when all is well."
                url:
                  type: string
                  title: "Public Endpoint"
                  description: "Public address. Absent while not exposed or not yet ready."
                argocd-url:
                  type: string
                  title: "ArgoCD Application"
                  description: "Link to the ArgoCD Application: sync log, errors, resource tree."

