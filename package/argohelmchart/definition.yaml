apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: argohelmcharts.catalog.cluster.local
spec:
  group: catalog.cluster.local
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: ArgoHelmChart
    annotations:
      catalog.cluster.local/title: "Argo Helm Chart"
      catalog.cluster.local/description: "Deploy any Helm chart from a Helm repository or OCI registry. ArgoCD creates and continuously auto-syncs an Application for it, so the deployed resources always match the chart, version, and values you specify. Secrets the chart needs can be defined alongside it, so chart and credentials ship as one unit."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://argo-cd.readthedocs.io/en/stable/user-guide/helm/"
      catalog.cluster.local/tags: "helm,gitops,argocd,argo,generic,deployment"
  names:
    kind: ArgoHelmChart
    plural: argohelmcharts
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          description: Deploys a Helm chart via an ArgoCD Application with automated sync (auto-sync, self-heal, and prune), optionally together with the Secrets the chart expects to find in its namespace.
          type: object
          properties:
            spec:
              description: Configuration for the Helm chart deployment.
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  properties:
                    chart:
                      type: object
                      title: "Chart"
                      description: "Helm chart to deploy."
                      properties:
                        repository:
                          type: string
                          title: "Repository"
                          description: "Chart repository URL. Use an https:// URL for a classic Helm repository, or an oci:// URL for an OCI registry."
                          minLength: 1
                          maxLength: 2048
                          pattern: '^(https://|oci://)\S+$'
                        name:
                          type: string
                          title: "Chart Name"
                          description: "Name of the chart within the repository."
                          minLength: 1
                          maxLength: 253
                        version:
                          type: string
                          title: "Chart Version"
                          description: "Chart version to deploy. Change it to roll out a new version; ArgoCD re-syncs automatically."
                          minLength: 1
                          maxLength: 253
                      required:
                        - repository
                        - name
                        - version
                    secrets:
                      type: array
                      title: "Secrets"
                      description: "Secrets to create in this instance's namespace, for charts that expect a Secret to already exist. Define it here and point the chart at it by name from Values (for example \"auth:\\n  existingSecret: my-chart-auth\"), so the chart and the credentials it needs ship as one item. Entries are stored in plain text in this resource, so anyone who can read the resource can read them."
                      maxItems: 16
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            title: "Secret Name"
                            description: "Name of the Secret to create. Must be unique within this namespace, and must not collide with a Secret the chart creates itself."
                            minLength: 1
                            maxLength: 253
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                          type:
                            type: string
                            title: "Type"
                            description: "Secret type. Opaque covers ordinary chart credentials; pick a typed variant when the chart expects one, such as an image pull secret or a TLS certificate."
                            default: "Opaque"
                            enum:
                              - "Opaque"
                              - "kubernetes.io/basic-auth"
                              - "kubernetes.io/ssh-auth"
                              - "kubernetes.io/tls"
                              - "kubernetes.io/dockerconfigjson"
                          data:
                            type: string
                            format: textarea
                            title: "Data"
                            description: "Secret entries as YAML key/value pairs (e.g. \"password: s3cr3t\"). Written verbatim, so do not base64-encode the values. A typed Secret needs the keys Kubernetes requires for that type, such as \".dockerconfigjson\", or \"tls.crt\" and \"tls.key\"."
                            minLength: 1
                            maxLength: 65536
                        required:
                          - name
                          - data
                      x-kubernetes-validations:
                        - rule: self.all(s, self.exists_one(o, o.name == s.name))
                          message: each secret name may only be used once
                    values:
                      type: string
                      format: textarea
                      title: "Values"
                      # TODO: point this at the real HTTPRoute documentation once it is published.
                      description: "Helm value overrides, as YAML in the same shape as the chart's own values.yaml (e.g. \"service:\\n  type: ClusterIP\"). Merged over the chart's defaults, so anything left out keeps its default. Left empty, the chart's own defaults apply as-is. To reach the chart from outside the cluster, give it an HTTPRoute -- see [the HTTPRoute documentation](https://example.com/docs/httproute)."
                      maxLength: 65536
                  required:
                    - chart
              required:
                - parameters
