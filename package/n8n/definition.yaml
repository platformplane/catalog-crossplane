apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: n8n.catalog.cluster.local
spec:
  group: catalog.cluster.local
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: N8n
    annotations:
      catalog.cluster.local/title: "n8n"
      catalog.cluster.local/description: "n8n is a workflow automation platform for connecting applications, APIs, and data with low-code workflows."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://n8n.io/"
      catalog.cluster.local/tags: "automation,workflow,low-code,unmanaged,helm"
  names:
    kind: N8n
    plural: n8n
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          description: N8n is the Schema for n8n instances
          type: object
          properties:
            spec:
              description: N8nSpec defines the desired state of an n8n instance
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  default: {}
                  properties:
                    size:
                      type: string
                      default: "4Gi"
                      description: Persistent storage allocated to n8n
                      pattern: ^(?<size>\d+(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?)$
                    version:
                      type: string
                      default: "2.36.9"
                      description: n8n version
                      enum:
                        - "2.36.9"
                    timezone:
                      type: string
                      default: "UTC"
                      minLength: 1
                      pattern: ^(UTC|[A-Za-z][A-Za-z0-9._+-]*(/[A-Za-z0-9._+-]+)+)$
                      description: Canonical IANA timezone for the instance and scheduled workflows (for example, Europe/Zurich)
                    retention:
                      type: object
                      default: {}
                      properties:
                        days:
                          type: integer
                          default: 14
                          minimum: 1
                          description: Number of days to retain completed execution data
                        maxExecutions:
                          type: integer
                          default: 10000
                          minimum: 0
                          description: Maximum completed executions to retain (0 disables the count limit)
                    resourceProfile:
                      type: string
                      default: small
                      description: "CPU and memory allocation for the n8n instance. small Max: 1 CPU, 1Gi RAM; medium Max: 2 CPU, 2Gi RAM; large Max: 4 CPU, 4Gi RAM."
                      enum:
                        - small
                        - medium
                        - large
                    maxConcurrentExecutions:
                      type: integer
                      default: 10
                      minimum: -1
                      description: Maximum concurrent production executions (-1 disables the limit)
                      x-kubernetes-validations:
                        - rule: self == -1 || self >= 1
                          message: maxConcurrentExecutions must be -1 or at least 1
                    smtp:
                      type: object
                      default: {}
                      description: Optional SMTP configuration loaded from a Secret in the instance namespace
                      properties:
                        secretName:
                          type: string
                          minLength: 1
                          maxLength: 253
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          description: >-
                            Name of the Kubernetes Secret in this namespace that contains the SMTP settings.
                            See [an example Secret](https://github.com/platformplane/catalog-crossplane/blob/main/examples/n8n-smtp-secret.yaml).
                    ingress:
                      type: object
                      default: {}
                      properties:
                        public:
                          type: boolean
                          default: true
                          description: Expose public endpoint (Be aware that your application will be publicly available on the internet.)
