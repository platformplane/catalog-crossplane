# Composition Definition: https://doc.crds.dev/github.com/crossplane/crossplane/apiextensions.crossplane.io/Composition/v1@v1.15.0
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: mysqls-v2.catalog.cluster.local
  annotations:
    catalog.cluster.local/title: "MySQLV2"
    catalog.cluster.local/description: "Unmanaged MySQL instance running within the cluster."
    catalog.cluster.local/maintainer: ""
    catalog.cluster.local/url: "https://www.mysql.com/"
    catalog.cluster.local/tags: "database,unmanaged,helm"
spec:
  compositeTypeRef:
    apiVersion: catalog.cluster.local/v2
    kind: MySQLCompositeV2

  writeConnectionSecretsToNamespace: crossplane-system

  mode: Pipeline
  pipeline:
    - step: mysql
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $kind := .observed.composite.resource.kind }}
            {{ $xrName := .observed.composite.resource.metadata.name }}
            {{ $namespace := .observed.composite.resource.metadata.namespace }}

            {{ $params := .observed.composite.resource.spec.parameters }}

            {{ $size := $params.size | default "8Gi" }}

            {{ $versionMapping := dict "8" "10.2.4" }}
            {{ $specVersion := $params.version | default "8" }}
            {{ $version := index $versionMapping $specVersion }}

            apiVersion: helm.m.crossplane.io/v1beta1
            kind: Release
            metadata:
              name: {{ $xrName }}
              namespace: {{ $namespace }}
              annotations:
                crossplane.io/external-name: {{ $xrName }}
                gotemplating.fn.crossplane.io/composition-resource-name: "helm-release"
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-helm
              forProvider:
                chart: # https://artifacthub.io/packages/helm/bitnami/mysql
                  name: mysql
                  repository: oci://registry-1.docker.io/bitnamicharts
                  version: {{ $version }}
                namespace: {{ $namespace }}
                values:
                  fullnameOverride: {{ $xrName }}
                  commonLabels:
                    catalog.cluster.local/kind: {{ $kind }}
                    catalog.cluster.local/name: {{ $xrName }}
                  architecture: standalone
                  auth:
                    database: db
                  primary:
                    persistence:
                      size: {{ $size }}
                    persistentVolumeClaimRetentionPolicy:
                      enabled: true
                      whenDeleted: Delete
                  # metrics:
                  #   enabled: true
                  #   serviceMonitor:
                  #     enabled: true

              connectionDetails:
                - apiVersion: v1
                  kind: Secret
                  name: {{ $xrName }}
                  namespace: {{ $namespace }}
                  fieldPath: data.mysql-root-password
                  toConnectionSecretKey: password

                - apiVersion: v1
                  kind: Service
                  name: {{ $xrName }}
                  namespace: {{ $namespace }}
                  fieldPath: spec.ports[0].port
                  toConnectionSecretKey: port

              writeConnectionSecretToRef:
                name: {{ $xrName }}-connection-secret
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $xrName }}-connection
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            {{ if eq $.observed.resources nil }}
            data: {}
            {{ else }}
            {{- $helmSecret := (index $.observed.resources "helm-release").connectionDetails | default dict }}
            {{- if and $helmSecret.password $helmSecret.port }}
            data:
              host: {{ printf "%s.%s" $xrName $namespace | b64enc }}
              username: {{ "root" | b64enc }}
              password: {{ $helmSecret.password }}
              port: {{ $helmSecret.port }}
              database: {{ dig "resources" "helm-release" "resource" "spec" "forProvider" "values" "auth" "database" "db" .observed | b64enc }}
            {{- else }}
            data: {}
            {{- end }}
            {{ end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
