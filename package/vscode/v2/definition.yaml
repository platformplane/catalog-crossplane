apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: vscode.catalog.cluster.local
spec:
  group: catalog.cluster.local
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: VSCode
    annotations:
      catalog.cluster.local/title: "VS Code Python"
      catalog.cluster.local/description: "Browser-based VS Code development environment backed by a Python devcontainer image."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://code-server.dev/"
      catalog.cluster.local/tags: "developer-tools,workspace,python,unmanaged,kubernetes"
  names:
    kind: VSCode
    plural: vscode
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          description: VSCode is the Schema for browser-based Python development environments.
          type: object
          properties:
            spec:
              description: VSCodeSpec defines the desired state of a VS Code development environment.
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  properties:
                    workspaceSize:
                      type: string
                      default: "8Gi"
                      description: Persistent workspace size.
                      pattern: ^(?<size>\d+(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?)$
                    pythonVersion:
                      type: string
                      default: "3.12"
                      description: Python version used for the devcontainer base image.
                      enum:
                        - "3.11"
                        - "3.12"
                    git:
                      type: object
                      default: {}
                      description: >-
                        Optional Git repository bootstrap and sync settings for the VS Code workspace.
                        Configure Git manually inside the browser session, for example:
                        git config --global user.name "Your Name" &&
                        git config --global user.email "you@example.com" &&
                        git config --global credential.username "your-gitlab-user" &&
                        git config --global credential.helper store.
                      properties:
                        repositoryUrl:
                          type: string
                          description: HTTPS Git repository URL to clone into the workspace on first start. Public repositories clone automatically; if a private repository requires authentication, open the browser workspace terminal, run git config --global credential.username "your-gitlab-user" and git config --global credential.helper store, then clone, pull, or push and enter your GitLab password or personal access token when prompted.
                        branch:
                          type: string
                          default: "main"
                          description: Git branch checked out and fast-forwarded when repository sync is enabled.
                        syncOnStart:
                          type: boolean
                          default: true
                          description: Pull the latest changes on pod start when the workspace repository is clean and already authenticated inside the workspace. If authentication is missing, open the browser workspace terminal and configure credential.username plus credential.helper store before retrying.
                    ingress:
                      type: object
                      default: {}
                      properties:
                        public:
                          type: boolean
                          default: true
                          description: Expose a public endpoint. If false, the internal ingress class is used.
