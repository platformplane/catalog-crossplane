apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: vscode.catalog.cluster.local
spec:
  group: catalog.cluster.local
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: VSCode
    annotations:
      catalog.cluster.local/title: "VS Code Python"
      catalog.cluster.local/description: "Browser-based VS Code development environment backed by a Python devcontainer image."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://code-server.dev/"
      catalog.cluster.local/tags: "developer-tools,workspace,python,unmanaged,kubernetes"
  names:
    kind: VSCode
    plural: vscode
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          description: VSCode is the Schema for browser-based Python development environments.
          type: object
          properties:
            spec:
              description: VSCodeSpec defines the desired state of a VS Code development environment.
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  properties:
                    workspaceSize:
                      type: string
                      default: "8Gi"
                      description: Persistent workspace size.
                      pattern: ^(?<size>\d+(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?)$
                    pythonVersion:
                      type: string
                      default: "3.12"
                      description: Python version used for the devcontainer base image.
                      enum:
                        - "3.11"
                        - "3.12"
                    git:
                      type: object
                      default: {}
                      description: Optional Git repository bootstrap and sync settings for the VS Code workspace.
                      properties:
                        repositoryUrl:
                          type: string
                          description: HTTPS Git repository URL to clone into the workspace on first start.
                        branch:
                          type: string
                          default: "main"
                          description: Git branch checked out and fast-forwarded when repository sync is enabled.
                        syncOnStart:
                          type: boolean
                          default: true
                          description: Pull the latest changes on pod start when the workspace repository is clean.
                        auth:
                          type: object
                          default: {}
                          description: Optional HTTP(S) credentials used for cloning and pushing to GitLab.
                          properties:
                            username:
                              type: string
                              description: GitLab username or deploy token username for HTTP(S) authentication.
                            password:
                              type: string
                              description: GitLab password or personal access token for HTTP(S) authentication.
                        user:
                          type: object
                          default: {}
                          description: Optional Git author details configured in the workspace.
                          properties:
                            name:
                              type: string
                              description: Value written to git user.name.
                            email:
                              type: string
                              description: Value written to git user.email.
                    ingress:
                      type: object
                      default: {}
                      properties:
                        public:
                          type: boolean
                          default: true
                          description: Expose a public endpoint. If false, the internal ingress class is used.
